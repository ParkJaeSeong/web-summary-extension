name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v7
        with:
          name: PageMind-0.1.0-chromium
          path: packages/PageMind-0.1.0-chromium.zip
          if-no-files-found: error
